# Aumenta la memoria del daemon de Gradle para evitar "GC thrashing"
# durante la compilación (el valor por defecto de 512 MiB es insuficiente
# para un proyecto con Jetpack Compose + Media3).
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError

# Acelera builds sucesivas reutilizando resultados de compilación
org.gradle.caching=true

# Habilita AndroidX (requerido por todas las librerías androidx.* usadas)
android.useAndroidX=true

# Habilita Kotlin en modo incremental para compilaciones más rápidas
kotlin.incremental=true
